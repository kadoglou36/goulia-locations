<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e85d2a">
    <title>Γουλιά | Πού θα μας βρεις</title>
    <link rel="icon" type="image/png" href="logo.png">
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <img src="logo.png" alt="Γουλιά - Φυσικοί σπιτικοί χυμοί" class="brand-logo">
      <p class="tagline">Λεμονάδα · Πορτοκαλάδα · Βυσσινάδα</p>
    </div>
    <div class="hero-copy"><p>Βρες το κοντινότερο σημείο που σερβίρει τους χυμούς μας.</p></div>
  </header>

  <main id="publicView" class="container">
    <section class="toolbar" aria-label="Αναζήτηση σημείων πώλησης">
      <label class="search-field"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Αναζήτηση σε πόλη ή κατάστημα" autocomplete="off"></label>
      <div id="regionFilters" class="region-filters" role="tablist" aria-label="Περιοχή"></div>
    </section>
    <div class="list-heading"><div><p class="eyebrow">Σημεία πώλησης</p><h2>Πού θα μας βρεις</h2></div><span id="resultCount" class="result-count"></span></div>
    <div id="locationsList" class="locations-list"></div>
  </main>

  <footer class="footer"><span>Γουλιά, φτιαγμένη για να μοιράζεται.</span></footer>

  <script>
    const state = { locations: [], region: 'ALL', query: '' };
    const eviaOrder = ['ΧΑΛΚΙΔΑ', 'ΒΑΣΙΛΙΚΟ', 'ΕΡΕΤΡΙΑ', 'ΑΜΑΡΥΝΘΟΣ', 'ΑΛΙΒΕΡΙ', 'ΒΕΛΟΣ', 'ΚΟΡΑΣΙΔΑ', 'ΝΕΟΧΩΡΙ', 'ΚΑΛΑΜΟΣ', 'ΛΕΠΟΥΡΑ', 'ΑΓ. ΑΠΟΣΤΟΛΟΙ', 'ΜΕΣΟΧΩΡΙΑ', 'ΝΕΑ ΣΤΥΡΑ', 'ΠΑΝΩ ΣΤΥΡΑ', 'ΜΑΡΜΑΡΙ', 'ΚΑΡΥΣΤΟΣ', 'ΠΑΡΑΛΙΑ ΚΥΜΗΣ', 'ΜΑΛΕΤΙΑΝΟΙ', 'ΚΑΘΕΝΟΙ'];
    // Εύβοια πρώτη, μετά Αθήνα (ΑΤΤΙΚΗ) — σταθερή σειρά ανεξάρτητα από τη σειρά στο data.json
    const regionOrder = ['ΕΥΒΟΙΑ', 'ΑΤΤΙΚΗ'];
    const regionLabels = { 'ΕΥΒΟΙΑ': 'Εύβοια', 'ΑΤΤΙΚΗ': 'Αθήνα' };

    async function loadLocations() {
      try {
        const response = await fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error('Data unavailable');
        const allLocations = await response.json();
          state.locations = allLocations; renderFilters(); renderLocations();
      } catch (error) {
          document.getElementById('locationsList').innerHTML = '<p class="no-results">Δεν ήταν δυνατή η φόρτωση των σημείων.</p>';
      }
    }

      function normalize(value) { return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

      function renderFilters() {
        const regions = ['ALL', ...regionOrder.filter(region => state.locations.some(location => location.region === region))];
        document.getElementById('regionFilters').innerHTML = regions.map(region => `<button class="filter-button ${state.region === region ? 'active' : ''}" data-region="${region}" role="tab" aria-selected="${state.region === region}">${region === 'ALL' ? 'Όλα' : (regionLabels[region] || region)}</button>`).join('');
        document.querySelectorAll('[data-region]').forEach(button => button.addEventListener('click', () => { state.region = button.dataset.region; renderFilters(); renderLocations(); }));
      }

      function renderLocations() {
        const query = normalize(state.query);
        const filtered = state.locations.filter(location => (state.region === 'ALL' || location.region === state.region) && normalize(`${location.name} ${location.city} ${location.address}`).includes(query));
        const grouped = filtered.reduce((groups, location) => { (groups[location.region] ||= []).push(location); return groups; }, {});
      const listContainer = document.getElementById('locationsList');
        document.getElementById('resultCount').textContent = `${filtered.length} σημεία`;
        const regions = regionOrder.filter(region => grouped[region]);
        listContainer.innerHTML = regions.map(region => {
          const items = grouped[region].slice().sort((a, b) => {
            const cityDiff = region === 'ΕΥΒΟΙΑ'
              ? (eviaOrder.indexOf(a.city) < 0 ? 999 : eviaOrder.indexOf(a.city)) - (eviaOrder.indexOf(b.city) < 0 ? 999 : eviaOrder.indexOf(b.city))
              : a.city.localeCompare(b.city, 'el');
            return cityDiff !== 0 ? cityDiff : a.name.localeCompare(b.name, 'el');
          });
          return `<section class="city-group"><div class="city-heading"><h3>${regionLabels[region] || region}</h3><span>${items.length}</span></div><div class="store-list">${items.map(location => `<a class="store-row" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${location.name} ${location.address} ${location.city}`)}" target="_blank" rel="noopener"><span class="store-info"><strong>${location.name}</strong><small>${[location.city, location.address].filter(Boolean).join(' · ') || 'Χωρίς καταχωρημένη διεύθυνση'}</small></span><span class="map-arrow" aria-hidden="true">↗</span></a>`).join('')}</div></section>`;
        }).join('') || '<p class="no-results">Δεν βρέθηκαν σημεία με αυτά τα κριτήρια.</p>';
    }

      document.getElementById('searchInput').addEventListener('input', event => { state.query = event.target.value; renderLocations(); });

    loadLocations();
  </script>
</body>
</html>
