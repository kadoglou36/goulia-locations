<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Γουλιά – Σημεία Πώλησης</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <h1>🧃 Γουλιά</h1>
      <p>Φυσικοί Χυμοί & Πορτοκαλάδες</p>
    </div>
    <h2>Σημεία Πώλησης</h2>
  </header>

  <main class="container">
    <div id="locationsList" class="locations-grid"></div>
  </main>

  <script>
    async function loadLocations() {
      try {
        const response = await fetch('data.json');
        const allLocations = await response.json();
        renderLocations(allLocations);
      } catch (error) {
        console.error('Σφάλμα φόρτωσης δεδομένων:', error);
      }
    }

    function renderLocations(locations) {
      const listContainer = document.getElementById('locationsList');
      listContainer.innerHTML = '';

      if (locations.length === 0) {
        listContainer.innerHTML = '<p class="no-results">Δεν υπάρχουν διαθέσιμα σημεία πώλησης.</p>';
        return;
      }

      locations.forEach(loc => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="badge badge-region">${loc.region}</span>
            ${loc.category ? `<span class="badge badge-cat">${loc.category}</span>` : ''}
          </div>
          <h3 class="store-name">${loc.name}</h3>
          <p class="store-city">📍 ${loc.city}</p>
          <p class="store-address">${loc.address}</p>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.name + ' ' + loc.city + ' ' + loc.address)}" 
             target="_blank" class="map-link">Προβολή στο Χάρτη ➔</a>
        `;
        listContainer.appendChild(card);
      });
    }

    loadLocations();
  </script>
</body>
</html>
